name: Release Python wheels

# Builds canonaut wheels for every supported platform and publishes them to
# PyPI when a tag is pushed.  Because the extension is built abi3-py39, one
# wheel per platform covers CPython 3.9 and later, so the matrix stays small.
#
# Publishing uses PyPI Trusted Publishing (OIDC): no API token is stored in the
# repository.  Register the publisher once at
# https://pypi.org/manage/account/publishing/ with
#   owner:       um-univie
#   repository:  canonaut
#   workflow:    release-python.yml
#   environment: pypi
# (as a "pending publisher" before the project's first release).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.platform.runner }}, ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
          - runner: macos-latest
            target: aarch64
          # GitHub retired the Intel macOS runners, so the x86_64 wheel is
          # cross-compiled from the Apple-silicon runner.
          - runner: macos-latest
            target: x86_64
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v5
      # Only the build interpreter; abi3-py39 still targets CPython 3.9+.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path bindings/python/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path bindings/python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  smoke-test:
    name: test ${{ matrix.artifact }} on Python ${{ matrix.python }}
    needs: [wheels, sdist]
    # Ubuntu 26.04 images have no Python 3.9.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.14"]
        artifact: [wheels-ubuntu-latest-x86_64, wheels-sdist]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - run: uv venv
      - name: Install the built artifact
        run: uv pip install dist/* pytest networkx
      - run: uv run --no-project pytest bindings/python/tests -v

  publish:
    name: publish to PyPI
    needs: [wheels, sdist, smoke-test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # Tolerate files that are already on PyPI (for instance a wheel uploaded
      # by hand before the workflow existed): the remaining artifacts still go
      # up, and the release does not fail over a duplicate.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
